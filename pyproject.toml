[project]
name = "ai-brew"
version = "0.1.0"
description = "A daily AI newsletter written by an AI agent, plus an MCP server for AI news"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.14",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]
